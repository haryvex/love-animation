
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Heart ❤️</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060208}
body{display:flex;justify-content:center;align-items:center}
canvas{display:block;width:min(100vmin,800px);height:min(100vmin,800px)}

#startScreen{
    position:fixed;inset:0;display:flex;justify-content:center;align-items:center;
    background:#060208;color:#e60d24;font:bold 26px Arial,sans-serif;
    letter-spacing:2px;cursor:pointer;z-index:10;
    transition:opacity .8s ease,transform .8s ease;
    animation:pulse 1.6s ease-in-out infinite;
    white-space:pre-line;text-align:center;padding:20px;
}
#startScreen.hide{
    animation:none;opacity:0;transform:translateX(100%);
    pointer-events:none
}
@keyframes pulse{
    0%,100%{transform:scale(1);opacity:.75}
    50%{transform:scale(1.08);opacity:1}
}
#muteBtn{
    position:fixed;right:16px;bottom:16px;width:44px;height:44px;border:none;
    border-radius:50%;background:rgba(230,13,36,.25);color:#fff;
    font-size:20px;cursor:pointer;z-index:5;display:none;
}
#muteBtn:hover{background:rgba(230,13,36,.5)}
</style>
</head>

<body>
<canvas id="loveCanvas" width="800" height="800"></canvas>
<div id="startScreen">Tap to start ♥</div>
<button id="muteBtn" title="Mute / Unmute">🔊</button>

<script>
"use strict";

const SC=21, OY=20, DURATION=25, TICK=16, ANIM=42, LIFT=34, GAP=7;
const SIZES=[9,10,11,12], FONT="Arial", BG="#060208";

const canvas=document.getElementById("loveCanvas");
const ctx=canvas.getContext("2d");
const startScreen=document.getElementById("startScreen");
const muteBtn=document.getElementById("muteBtn");

/* ===== AUDIO SETTINGS ===== */

// Song starts at 2:35 and stops at 3:12.
const START_AT=155;
const END_AT=192;
const PLAY_DURATION=END_AT-START_AT;
const SONG_PATH="heartmusic/love-song.mp3";

const AC=window.AudioContext||window.webkitAudioContext;
const actx=new AC();
const gain=actx.createGain();
gain.gain.value=0.8;
gain.connect(actx.destination);

let started=false;
let animationRunning=false;
let isMuted=false;
let audioBuffer=null;
let audioError=null;
let currentSource=null;
let shimmerTimer=null;
let shimmerOffTimers=[];

const bufferPromise=fetch(SONG_PATH)
    .then(response=>{
        if(!response.ok){
            throw new Error(
                SONG_PATH+" nahi mila (HTTP "+response.status+")."
            );
        }
        return response.arrayBuffer();
    })
    .then(data=>actx.decodeAudioData(data))
    .then(buffer=>{
        audioBuffer=buffer;
        return buffer;
    })
    .catch(error=>{
        audioError=error;
        throw error;
    });

bufferPromise.catch(()=>{});

/* ===== START SONG AND ANIMATION ===== */

async function startAll(){
    if(started)return;
    started=true;
    startScreen.style.pointerEvents="none";

    try{
        if(location.protocol==="file:"){
            throw new Error(
                "Website file mode mein khuli hai. "+
                "VS Code ke Live Server se website kholo."
            );
        }

        if(!audioBuffer){
            startScreen.textContent="Preparing music...";
        }

        const buffer=audioBuffer||await bufferPromise;

        if(buffer.duration<END_AT){
            throw new Error(
                "Song kam se kam 3 minutes 12 seconds ka hona chahiye."
            );
        }

        await actx.resume();

        const source=actx.createBufferSource();
        source.buffer=buffer;
        source.loop=false;
        source.connect(gain);
        currentSource=source;

        gain.gain.setValueAtTime(
            isMuted?0:0.8,
            actx.currentTime
        );

        const startTime=actx.currentTime+0.05;

        // Play only from 2:35 to 3:12 (37 seconds).
        source.start(startTime,START_AT,PLAY_DURATION);

        source.onended=()=>{
            if(currentSource===source){
                currentSource=null;
                resetToStart();
            }
        };

        startScreen.classList.add("hide");
        muteBtn.style.display="block";
        muteBtn.textContent=isMuted?"🔇":"🔊";

        resetAnimationData();
        animationRunning=true;
        requestAnimationFrame(step);

    }catch(error){
        console.error("Audio error:",error);

        if(currentSource){
            try{currentSource.stop();}catch(e){}
            currentSource=null;
        }

        started=false;
        animationRunning=false;
        startScreen.style.pointerEvents="auto";
        startScreen.classList.remove("hide");
        startScreen.textContent="Tap to start ♥";

        let message=error.message;

        if(audioError){
            message=audioError.message+
                "\n\nCheck karo ki heartmusic folder mein love-song.mp3 hai.";
        }

        alert("Song start nahi ho saka:\n\n"+message);
    }
}

startScreen.addEventListener("click",startAll);

window.addEventListener("keydown",event=>{
    if(event.code==="Space"&&!started){
        event.preventDefault();
        startAll();
    }
});

muteBtn.addEventListener("click",event=>{
    event.stopPropagation();
    isMuted=!isMuted;
    gain.gain.setTargetAtTime(
        isMuted?0:0.8,
        actx.currentTime,
        0.015
    );
    muteBtn.textContent=isMuted?"🔇":"🔊";
});

/* ===== HEART ANIMATION ===== */

const rng=(()=>{
    let seed=11;
    return{
        random(){
            seed=(seed*1664525+1013904223)>>>0;
            return seed/4294967296;
        },
        uniform(a,b){
            return a+this.random()*(b-a);
        },
        choice(arr){
            return arr[Math.floor(this.random()*arr.length)];
        },
        shuffle(arr){
            for(let i=arr.length-1;i>0;i--){
                const j=Math.floor(this.random()*(i+1));
                [arr[i],arr[j]]=[arr[j],arr[i]];
            }
            return arr;
        }
    };
})();

const PHRASES=[
"I love you","Seni seviyorum","Te amo","Je t'aime",
"Ich liebe dich","Ti amo","Eu te amo","Я тебя люблю",
"사랑해","愛してる","我爱你","मैं तुमसे प्यार करता हूँ",
"Σ' αγαπώ","Ik hou van jou","Jag älskar dig","Kocham cię",
"ฉันรักเธอ","Anh yêu em","Aku cinta kamu","Я тобі кохаю"
];

const FLASH=[1.0,0.78,0.78];
const BGC=[
    parseInt(BG.slice(1,3),16)/255,
    parseInt(BG.slice(3,5),16)/255,
    parseInt(BG.slice(5,7),16)/255
];

const mainIds=[];
const active=[];

function clamp(v){return Math.max(0,Math.min(1,v));}
function mix(a,b,k){return a.map((v,i)=>v+(b[i]-v)*k);}
function dim(c,k){return c.map(v=>v*k);}
function hx(c){
    return "#"+c.map(v=>Math.round(clamp(v)*255).toString(16).padStart(2,"0")).join("");
}
function fontFor(size){return `bold ${size}px ${FONT}`;}

function heart(a){
    const x=16*Math.pow(Math.sin(a),3);
    const y=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);
    return [x*SC,y*SC+OY];
}

const POLY=Array.from({length:720},(_,i)=>heart(2*Math.PI*i/720));
const EDGES=POLY.map((p,i)=>[p,POLY[(i+1)%POLY.length]]);
const YMAX=Math.max(...POLY.map(p=>p[1]));
const YMIN=Math.min(...POLY.map(p=>p[1]));
const CY=(YMAX+YMIN)/2;

function spans(y){
    const xs=[];
    for(const [[x1,y1],[x2,y2]] of EDGES){
        if((y1<=y&&y<y2)||(y2<=y&&y<y1)){
            xs.push(x1+(y-y1)*(x2-x1)/(y2-y1));
        }
    }
    xs.sort((a,b)=>a-b);
    const result=[];
    for(let i=0;i<xs.length;i+=2){
        if(xs[i+1]!==undefined)result.push([xs[i],xs[i+1]]);
    }
    return result;
}

function intersect(A,B){
    const out=[];
    for(const a of A)for(const b of B){
        const lo=Math.max(a[0],b[0]),hi=Math.min(a[1],b[1]);
        if(hi-lo>14)out.push([lo,hi]);
    }
    return out;
}

function* phraseCycle(){
    while(true)yield* rng.shuffle([...PHRASES]);
}

function mathDist(x,y){
    return Math.hypot(x/(16*SC),(y-CY)/(14.5*SC));
}

function build(){
    const cycle=phraseCycle();
    const rowH=Math.max(...SIZES.map(size=>size+3))+4;
    const half=rowH/2;
    const placed=[];

    for(let y=YMAX-half;y>YMIN+half;y-=rowH){
        const row=intersect(spans(y+half),spans(y-half));
        for(let [lo,hi] of row){
            lo+=4;hi-=4;
            let cur=lo+rng.uniform(0,8);
            const line=[];

            while(true){
                let fit=null;
                for(let tries=0;tries<10;tries++){
                    const text=cycle.next().value;
                    const size=rng.choice(SIZES);
                    ctx.font=fontFor(size);
                    const w=ctx.measureText(text).width;
                    if(cur+w<=hi){fit={text,size,w};break;}
                }
                if(!fit)break;
                line.push({x:cur+fit.w/2,text:fit.text,size:fit.size,w:fit.w});
                cur+=fit.w+GAP;
            }

            if(!line.length)continue;
            if(line.length>1){
                const left=hi-(line[line.length-1].x+line[line.length-1].w/2);
                line.forEach((item,i)=>item.x+=left*i/(line.length-1));
            }else line[0].x=(lo+hi)/2;

            line.forEach(item=>placed.push({
                x:item.x,y,text:item.text,size:item.size,
                edge:item===line[0]||item===line[line.length-1]
            }));
        }
    }

    const wine=[0.58,0.0,0.09],crimson=[0.90,0.05,0.14],blood=[0.98,0.10,0.16];

    for(const p of placed){
        const rad=Math.min(1,mathDist(p.x,p.y));
        let base=mix(wine,crimson,0.25+0.75*rad);
        base=mix(base,blood,rng.uniform(0,0.35)+(p.edge?0.3:0));
        p.color=base.map(v=>Math.min(1,v));
        p.rad=rad;
    }

    const edges=placed.filter(p=>p.edge);
    const inner=placed.filter(p=>!p.edge);

    edges.sort((a,b)=>
        (Math.atan2(a.x,a.y-CY)+2*Math.PI)%(2*Math.PI)-
        (Math.atan2(b.x,b.y-CY)+2*Math.PI)%(2*Math.PI)
    );
    inner.sort((a,b)=>b.rad-a.rad);

    return [...edges,...inner];
}

const ORDER=build();
let index=0,acc=0,spawning=true;
const RATE=ORDER.length/(DURATION*1000/TICK);

function resetAnimationData(){
    if(shimmerTimer!==null){
        clearTimeout(shimmerTimer);
        shimmerTimer=null;
    }

    shimmerOffTimers.forEach(timer=>clearTimeout(timer));
    shimmerOffTimers=[];

    active.length=0;
    mainIds.length=0;
    index=0;
    acc=0;
    spawning=true;
    ctx.clearRect(0,0,canvas.width,canvas.height);
}

function resetToStart(){
    // Stop every animation effect and clear the old heart.
    animationRunning=false;
    resetAnimationData();

    started=false;
    startScreen.textContent="Tap to start ♥";
    startScreen.classList.remove("hide");
    startScreen.style.pointerEvents="auto";

    muteBtn.style.display="none";
    muteBtn.textContent=isMuted?"🔇":"🔊";
}

function spawn(p){
    p.f=0;
    p.dx=rng.uniform(-10,10);
    p.finished=false;
    p.shimmer=false;
    active.push(p);
    mainIds.push(p);
}

function drawText(p,x,y,color,size=p.size){
    ctx.font=fontFor(size);
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillStyle=color;
    ctx.fillText(p.text,x+canvas.width/2,y+canvas.height/2);
}

function mathSin(v){return Math.sin(Math.PI*v);}

function animate(p){
    p.f++;
    const u=clamp(p.f/ANIM);
    const e=1-Math.pow(1-u,3);
    const c=p.color,x=p.x,y=-p.y;
    const hover=(1-e)*LIFT;
    const px=x+p.dx*(1-e),py=y-hover;

    drawText(p,px+2,py+3,hx(mix(BGC,dim(c,0.30),e)));
    drawText(p,px,py,hx(mix(BGC,dim(c,0.20),e*e)),p.size+1);

    const flash=0.75*mathSin(clamp((u-0.55)/0.45));
    const col=mix(mix(BGC,c,Math.pow(e,1.5)),FLASH,flash);
    drawText(p,px,py,hx(col));

    if(u>=1){p.finished=true;return false;}
    return true;
}

function shimmer(){
    if(!animationRunning||!mainIds.length)return;

    const p=rng.choice(mainIds);
    p.shimmer=true;

    const offTimer=setTimeout(()=>{
        p.shimmer=false;
        shimmerOffTimers=shimmerOffTimers.filter(t=>t!==offTimer);
    },260);

    shimmerOffTimers.push(offTimer);

    shimmerTimer=setTimeout(()=>{
        shimmerTimer=null;
        shimmer();
    },140);
}

function step(){
    // Do not keep drawing after the song has ended.
    if(!animationRunning)return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(spawning){
        acc+=RATE;
        while(acc>=1&&index<ORDER.length){
            acc-=1;
            spawn(ORDER[index++]);
        }
        if(index>=ORDER.length){
            spawning=false;
            shimmer();
        }
    }

    for(let i=active.length-1;i>=0;i--){
        if(!animate(active[i]))active.splice(i,1);
    }

    for(const p of mainIds){
        if(p.finished){
            const color=p.shimmer?hx(mix(p.color,FLASH,0.6)):hx(p.color);
            drawText(p,p.x,-p.y,color);
        }
    }

    if(animationRunning){
        requestAnimationFrame(step);
    }
}
</script>
</body>
</html>
